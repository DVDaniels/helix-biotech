<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helix -- AI-Powered Precision Medicine</title>
<link href="https://fonts.googleapis.com/css7?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{ --bg:#020a0f; --cyan:#00d4ff; --green:#00ff94; --text:#e8f4f8; --muted:#4a7a8a;}
html{scroll-behavior:smooth;}
body{font-family:'Space Grotesk',background:var(--bg);color:var(--text);overflow-x:hidden;}
nav{position:fixed;top:0;left:0;right:0;z-index:200;padding:1.5rem 3rem;display:flex;justify-content:space-between;align-items:center;background:rgba(2,10,15,0.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.07);}
.nav-name{font-weight:600;font-size:1.1rem;}
.nav-name span{color:var(--cyan);}
.hero{min-height:100vh;display:flex;align-items:center;position:relative;z-index:1;padding:6rem 3rem 3rem;}
h1{font-family:'DM Serif Display',serif;font-size:clamp(2.8rem,5.5vw,4.8rem);font-weight:400;line-height:1.05;margin-bottom:1.5rem;}
h1 em{font-style:italic;color:var(--cyan);}
.badge{display:inline-flex;align-items:center;gap:.5rem;background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.2);color:var(--cyan);font-size:.72rem;padding:.35rem 1rem;border-radius:100px;margin-bottom:1.5rem;}
.btn-cyan{background:linear-gradient(135deg,var(--cyan),#00a896);color:var(--bg);padding:.9rem 2rem;font-size:.85rem;font-weight:600;border:none;cursor:pointer;font-family:inherit;border-radius:6px;}
.gene-display{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:24;box:1 solid rgba(0,212,255,0.5) top;}
#dna-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.4;}
footer{background:rgba(255,255,255,0.02);border-top:1px solid rgba(255,255,255,0.07);padding:2.5rem 3rem;display:flex;justify-content:space-between;position:relative;z-index:1;}
</style></head><body><canvas id="dna-canvas"></canvas><nav><div class="nav-name">Helix<span>AI</span></div><button class="btn-cyan" style="font-family:inherit;">Request Access</button></nav><section class="hero"><div style="max-width:600px;position:relative;z-index:1;"><div class="badge">Live genomic analysis active</div><h1>Decode disease<br>before it <em>begins.</em></h1><p style="font-size:1rem;color:var(--muted);line-height:1.85;margin-bottom:2.5rem;">Helix combines next-generation sequencing with proprietary AI to deliver precision medicine insights at population scale.</p><button class="btn-cyan">Explore the Platform</button></div></section><footer><div style="font-weight:600;">Helix<span style="color:#00d4ff;">AI</span></div><div style="font-size:.t5rem;color:#4a7a8a;">© 2025 Helix Genomics Inc.</div></footer><script>const c=document.getElementById('dna-canvas');const ctx=c.getContext('2d');c.width=window.innerWidth;c.height=window.innerHeight;function draw(t){ctx.clearRect(0,0,c.width,c.height);for(let y=0;y<c.height;y+=8){const x1=c.width/2+Math.sin(y*.02+t)*50;ctx.beginPath();ctx.arc(x1,y,2,0,Math.PI*2);ctx.fillStyle=`rgba(0,212,255,${0.2+Math.sin(y*.02)*.1})`;ctx.fill();const x2=c.width/2-Math.sin(y*.02+t)*50;ctx.beginPath();ctx.arc(x2,y,2,0,Math.PI*2);ctx.fillStyle=`rgba(0,255,148,${0.2+Math.sin(y*.02)*.1})`;ctx.fill();if(y%20===0){ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.strokeStyle=`rgba(0,168,150,0.1)`;ctx.stroke();}}}let t=0;(function a(){t+=.02;draw(t);requestAnimationFrame(a);})();</script></body></html>
